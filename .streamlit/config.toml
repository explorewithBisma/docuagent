# The look (dark, bottle green + emerald). Everything Streamlit's own theme can do is set here; the rest is assets/theme.css.
[theme]
base = "dark"
primaryColor = "#10B981"
backgroundColor = "#0B0F0D"
secondaryBackgroundColor = "#121A16"
textColor = "#E8F0EC"
borderColor = "#1F2E27"
linkColor = "#10B981"
baseRadius = "1rem"
buttonRadius = "full"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap, sans-serif"

[server]
headless = true
maxUploadSize = 50          # MB per file: plenty for a statement or a sheet, and gentle on a shared server

[browser]
gatherUsageStats = false
